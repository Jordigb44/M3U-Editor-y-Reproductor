name: CD - Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
          yes | sdkmanager --licenses >/dev/null || true

      - name: Touch .env
        run: touch .env

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build signed release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :apptv:assembleRelease --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "M3U-Editor-y-Reproductor-${TAG}-mobile.apk"
          cp apptv/build/outputs/apk/release/apptv-release.apk "M3U-Editor-y-Reproductor-${TAG}-tv.apk"
          ls -la M3U-Editor-y-Reproductor-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            M3U-Editor-y-Reproductor-*-mobile.apk
            M3U-Editor-y-Reproductor-*-tv.apk
          name: M3U Editor y Reproductor ${{ github.ref_name }}
          generate_release_notes: true
